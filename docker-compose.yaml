services:
  bbox-exporter:
    build:
      context: .
      args:
        BUN_VERSION: "1.3"
    image: bbox-exporter:latest
    restart: unless-stopped
    environment:
      BBOX_PASSWORD: ${BBOX_PASSWORD:?BBOX_PASSWORD is required}
      BBOX_URL: ${BBOX_URL:-https://mabbox.bytel.fr}
      BBOX_RESOLVE_ADDRESS: ${BBOX_RESOLVE_ADDRESS:-}
      BBOX_TLS_INSECURE: ${BBOX_TLS_INSECURE:-true}
      BBOX_SCRAPE_TIMEOUT_MS: ${BBOX_SCRAPE_TIMEOUT_MS:-30000}
      BBOX_LOGS_POLL_INTERVAL_MS: ${BBOX_LOGS_POLL_INTERVAL_MS:-120000}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-}
      LOKI_LABELS: ${LOKI_LABELS:-job=bbox-exporter,source=bbox}
      LOKI_TENANT_ID: ${LOKI_TENANT_ID:-}
      TELEMETRY_ADDRESS: 0.0.0.0:9100
      METRICS_PATH: /metrics
    extra_hosts:
      - "mabbox.bytel.fr:${BBOX_RESOLVE_ADDRESS:-192.168.1.254}"
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    depends_on:
      - bbox-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

volumes:
  prometheus-data:
